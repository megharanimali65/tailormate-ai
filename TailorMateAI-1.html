/* ================= HELPERS ================= */

function uid(p = "id") { return p + "_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36); }
function fmtDate(d) { if (!d) return "—"; try { return new Date(d + "T00:00:00").toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }); } catch { return d; } }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function isToday(d) { return d === todayStr(); }
function inCurrentMonth(d) { if (!d) return false; const a = new Date(d), b = new Date(); return a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear(); }
function money(n) { const v = Number(n) || 0; return "₹" + v.toLocaleString("en-IN", { maximumFractionDigits: 0 }); }
function initials(name) { if (!name) return "?"; return name.trim().split(/\s+/).slice(0, 2).map(s => s[0]?.toUpperCase()).join(""); }

async function storeGet(key) { try { const v = localStorage.getItem("tailormate_" + key); return v ? JSON.parse(v) : null; } catch { return null; } }
async function storeSet(key, val) { try { localStorage.setItem("tailormate_" + key, JSON.stringify(val)); } catch (e) { console.error("save failed", key, e); } }

/* ================= APP ================= */

function App() {
  const [ready, setReady] = useState(false);
  const [customers, setCustomers] = useState([]);
  const [orders, setOrders] = useState([]);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [orderSeq, setOrderSeq] = useState(0);
  const [stack, setStack] = useState([{ screen: "home" }]);
  const [quickAdd, setQuickAdd] = useState(false);
  const [toast, setToast] = useState("");
  const [upgradeOpen, setUpgradeOpen] = useState(false);

  useEffect(() => {
    (async () => {
      const [c, o, s, seq] = await Promise.all([
        storeGet("customers"), storeGet("orders"), storeGet("settings"), storeGet("orderSeq"),
      ]);
      if (c) setCustomers(c);
      if (o) setOrders(o);
      if (s) setSettings({ ...DEFAULT_SETTINGS, ...s });
      if (seq) setOrderSeq(seq);
      setReady(true);
    })();
  }, []);

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(""), 1800); }

  function persistCustomers(next) { setCustomers(next); storeSet("customers", next); }
  function persistOrders(next) { setOrders(next); storeSet("orders", next); }
  function persistSettings(next) { setSettings(next); storeSet("settings", next); }

  function push(screen, params = {}) { setStack(s => [...s, { screen, params }]); }
  function pop() { setStack(s => (s.length > 1 ? s.slice(0, -1) : s)); }
  function gotoTab(screen) { setStack([{ screen }]); }
  function resetTo(screen, params = {}) { setStack([{ screen, params }]); }

  const current = stack[stack.length - 1];
  const lang = NAV_LABELS[settings.language] || NAV_LABELS.English;

  /* ---------- customer ops ---------- */
  function upsertCustomer(data) {
    if (data.id) {
      persistCustomers(customers.map(c => c.id === data.id ? { ...c, ...data } : c));
      return data.id;
    }
    if (!settings.isPremium && customers.length >= FREE_LIMIT) { setUpgradeOpen(true); return null; }
    const id = uid("cust");
    const rec = { id, createdAt: Date.now(), measurements: {}, payments: [], ...data };
    persistCustomers([rec, ...customers]);
    return id;
  }
  function deleteCustomer(id) {
    persistCustomers(customers.filter(c => c.id !== id));
    persistOrders(orders.filter(o => o.customerId !== id));
  }

  /* ---------- order ops ---------- */
  function nextOrderNumber() {
    const n = orderSeq + 1;
    setOrderSeq(n); storeSet("orderSeq", n);
    return "TM-" + String(n).padStart(4, "0");
  }
  function upsertOrder(data) {
    if (data.id) {
      persistOrders(orders.map(o => o.id === data.id ? { ...o, ...data } : o));
      return data.id;
    }
    if (!settings.isPremium && orders.length >= FREE_LIMIT) { setUpgradeOpen(true); return null; }
    const id = uid("ord");
    const rec = { id, orderNumber: nextOrderNumber(), createdAt: Date.now(), status: "NEW", ...data };
    persistOrders([rec, ...orders]);
    return id;
  }
  function deleteOrder(id) { persistOrders(orders.filter(o => o.id !== id)); }

  /* ---------- derived stats ---------- */
  const stats = useMemo(() => {
    const pending = orders.filter(o => !["DELIVERED", "CANCELLED"].includes(o.status));
    const todaysDeliveries = orders.filter(o => isToday(o.deliveryDate));
    const monthOrders = orders.filter(o => inCurrentMonth(o.deliveryDate) && o.status === "DELIVERED");
    const monthRevenue = monthOrders.reduce((s, o) => s + (Number(o.stitchingCharge) || 0), 0);
    const todaysOrders = orders.filter(o => isToday(o.orderDate));
    const todaysRevenue = orders.filter(o => isToday(o.deliveryDate) && o.status === "DELIVERED")
      .reduce((s, o) => s + (Number(o.stitchingCharge) || 0), 0);
    const pendingPayments = orders.reduce((s, o) => s + Math.max((Number(o.stitchingCharge) || 0) - (Number(o.advance) || 0), 0), 0);
    const completed = orders.filter(o => ["READY", "DELIVERED"].includes(o.status));
    return { pending, todaysDeliveries, monthRevenue, todaysOrders, todaysRevenue, pendingPayments, completed };
  }, [orders]);

  if (!ready) {
    return (
      <div style={shellStyle}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100%", flexDirection: "column", gap: 12 }}>
          <img src={LOGO} alt="" style={{ width: 64, height: 64, borderRadius: 16 }} />
          <div style={{ color: "#7A1B3A", fontFamily: "'Playfair Display',serif" }}>Loading TailorMate AI…</div>
        </div>
      </div>
    );
  }

  const ctx = {
    customers, orders, settings, stats,
    push, pop, gotoTab, resetTo,
    upsertCustomer, deleteCustomer, upsertOrder, deleteOrder,
    persistSettings, showToast, setUpgradeOpen, lang,
  };

  return (
    <div style={shellStyle}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
        * { font-family: 'Inter', system-ui, sans-serif; box-sizing: border-box; }
        ::-webkit-scrollbar { width: 0px; height: 0px; }
        button { font-family: inherit; }
      `}</style>

      <div style={{ flex: 1, overflowY: "auto", position: "relative", paddingBottom: 10 }}>
        {current.screen === "home" && <HomeScreen {...ctx} />}
        {current.screen === "customers" && <CustomersList {...ctx} />}
        {current.screen === "customerForm" && <CustomerForm {...ctx} params={current.params} />}
        {current.screen === "customerDetail" && <CustomerDetail {...ctx} params={current.params} />}
        {current.screen === "measurementForm" && <MeasurementForm {...ctx} params={current.params} />}
        {current.screen === "orders" && <OrdersList {...ctx} />}
        {current.screen === "orderForm" && <OrderForm {...ctx} params={current.params} />}
        {current.screen === "orderDetail" && <OrderDetail {...ctx} params={current.params} />}
        {current.screen === "calculator" && <CalculatorScreen {...ctx} params={current.params} />}
        {current.screen === "more" && <MoreScreen {...ctx} />}
        {current.screen === "design" && <DesignScreen {...ctx} params={current.params} />}
        {current.screen === "whatsapp" && <WhatsAppScreen {...ctx} params={current.params} />}
        {current.screen === "summary" && <SummaryScreen {...ctx} />}
        {current.screen === "settings" && <SettingsScreen {...ctx} />}
        {current.screen === "search" && <SearchScreen {...ctx} />}
      </div>

      <Toast text={toast} />

      {quickAdd && (
        <div onClick={() => setQuickAdd(false)} style={{
          position: "absolute", inset: 0, background: "rgba(42,30,34,0.45)", zIndex: 40,
          display: "flex", alignItems: "flex-end",
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            width: "100%", background: "#FBF6EC", borderRadius: "20px 20px 0 0", padding: "10px 16px 26px",
          }}>
            <div style={{ width: 40, height: 4, background: "#E4D3AE", borderRadius: 4, margin: "6px auto 16px" }} />
            <QuickRow icon={<Icon name="UserRound" size={19} />} label="New Customer" onClick={() => { setQuickAdd(false); push("customerForm", {}); }} />
            <QuickRow icon={<Icon name="ClipboardList" size={19} />} label="New Order" onClick={() => { setQuickAdd(false); push("orderForm", {}); }} />
          </div>
        </div>
      )}

      {upgradeOpen && <UpgradeModal onClose={() => setUpgradeOpen(false)} settings={settings} persistSettings={persistSettings} showToast={showToast} />}

      <div style={{
        display: "flex", borderTop: "1px solid #E4D3AE", background: "#FFFDF8", position: "relative", zIndex: 30,
      }}>
        <NavBtn icon={<Icon name="Home" size={20} />} label={lang.home} active={current.screen === "home"} onClick={() => gotoTab("home")} />
        <NavBtn icon={<Icon name="Users" size={20} />} label={lang.customers} active={current.screen === "customers"} onClick={() => gotoTab("customers")} />
        <div style={{ width: 58, flexShrink: 0 }} />
        <NavBtn icon={<Icon name="ClipboardList" size={20} />} label={lang.orders} active={current.screen === "orders"} onClick={() => gotoTab("orders")} />
        <NavBtn icon={<Icon name="MoreHorizontal" size={20} />} label={lang.more} active={current.screen === "more"} onClick={() => gotoTab("more")} />
      </div>

      <button onClick={() => setQuickAdd(true)} style={{
        position: "absolute", bottom: 46, left: "50%", transform: "translateX(-50%)",
        width: 56, height: 56, borderRadius: "50%", border: "3px solid #FBF6EC",
        background: "linear-gradient(135deg,#C79B3B,#9E7A24)", display: "flex", alignItems: "center",
        justifyContent: "center", boxShadow: "0 6px 16px rgba(126,90,20,0.4)", cursor: "pointer", zIndex: 31,
      }}>
        <Icon name="Plus" size={26} color="#FBF6EC" strokeWidth={2.8} />
      </button>
    </div>
  );
}

function CustomersList(ctx) {
  const { customers, push, deleteCustomer, showToast } = ctx;
  const [q, setQ] = useState("");
  const filtered = customers.filter(c => !q || c.name?.toLowerCase().includes(q.toLowerCase()) || c.mobile?.includes(q));
  return (
    <div>
      <ScreenHeader title="Customers" right={<span style={{ fontSize: 12, color: "#8a7360" }}>{customers.length}/{ctx.settings.isPremium ? "∞" : FREE_LIMIT}</span>} />
      <div style={{ padding: "0 16px" }}>
        <TextInput placeholder="Search by name or mobile" value={q} onChange={e => setQ(e.target.value)} style={{ marginBottom: 12 }} />
        {filtered.length === 0 && <EmptyState icon={<Icon name="Users" size={34} />} title="No customers yet" sub="Tap the + button below to add your first customer." />}
        {filtered.map(c => (
          <div key={c.id} onClick={() => push("customerDetail", { id: c.id })} style={{
            display: "flex", alignItems: "center", gap: 12, padding: "12px 10px", background: "#FFFDF8",
            border: "1px solid #EADFC0", borderRadius: 12, marginBottom: 9, cursor: "pointer",
          }}>
            <Avatar photo={c.photo} name={c.name} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: "#3B0F20" }}>{c.name}</div>
              <div style={{ fontSize: 12.5, color: "#8a7360" }}>{c.mobile || "No number"} · {c.gender || "—"}</div>
            </div>
            <Icon name="ChevronRight" size={17} color="#C79B3B" />
          </div>
        ))}
      </div>
    </div>
  );
}

function Avatar({ photo, name, size = 44 }) {
  return photo ? (
    <img src={photo} alt="" style={{ width: size, height: size, borderRadius: "50%", objectFit: "cover", flexShrink: 0 }} />
  ) : (
    <div style={{
      width: size, height: size, borderRadius: "50%", background: "#F1E4C9", color: "#7A1B3A",
      display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: size * 0.36, flexShrink: 0,
    }}>{initials(name)}</div>
  );
}

function PhotoPicker({ value, onChange, round }) {
  const ref = useRef();
  function handleFile(e) {
    const f = e.target.files?.[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => onChange(reader.result);
    reader.readAsDataURL(f);
  }
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
      <div onClick={() => ref.current?.click()} style={{
        width: 64, height: 64, borderRadius: round ? "50%" : 12, background: "#F1E4C9",
        display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
        overflow: "hidden", border: "1.5px dashed #C79B3B", flexShrink: 0,
      }}>
        {value ? <img src={value} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <Icon name="Camera" size={22} color="#7A1B3A" />}
      </div>
      <input ref={ref} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
      <button onClick={() => ref.current?.click()} style={{ fontSize: 12.5, color: "#7A1B3A", fontWeight: 700, background: "none", border: "none", cursor: "pointer" }}>
        {value ? "Change photo" : "Add photo"}
      </button>
    </div>
  );
}

function CustomerForm(ctx) {
  const { params, customers, upsertCustomer, pop, showToast } = ctx;
  const existing = params?.id ? customers.find(c => c.id === params.id) : null;
  const [form, setForm] = useState(existing || { name: "", mobile: "", gender: "Female", ageGroup: "Adult", notes: "", photo: "" });

  function set(k, v) { setForm(f => ({ ...f, [k]: v })); }
  function submit() {
    if (!form.name.trim()) { showToast("Please enter a name"); return; }
    const id = upsertCustomer(form);
    if (id) { showToast(existing ? "Customer updated" : "Customer added"); pop(); }
  }

  return (
    <div>
      <ScreenHeader title={existing ? "Edit Customer" : "New Customer"} onBack={pop} />
      <div style={{ padding: "0 16px 24px" }}>
        <Field label="Customer photo">
          <PhotoPicker value={form.photo} onChange={v => set("photo", v)} round />
        </Field>
        <Field label="Customer Name *">
          <TextInput value={form.name} onChange={e => set("name", e.target.value)} placeholder="e.g. Priya Sharma" />
        </Field>
        <Field label="Mobile Number">
          <TextInput value={form.mobile} onChange={e => set("mobile", e.target.value)} placeholder="10-digit mobile" inputMode="numeric" />
        </Field>
        <Field label="Gender">
          <Select value={form.gender} onChange={e => set("gender", e.target.value)} options={["Female", "Male", "Other"]} />
        </Field>
        <Field label="Age Group">
          <Select value={form.ageGroup} onChange={e => set("ageGroup", e.target.value)} options={["Kid", "Teen", "Adult", "Senior"]} />
        </Field>
        <Field label="Notes">
          <TextArea value={form.notes} onChange={e => set("notes", e.target.value)} placeholder="Preferences, fit notes, allergies to fabric, etc." />
        </Field>
        <PrimaryButton onClick={submit}>{existing ? "Save Changes" : "Save Customer"}</PrimaryButton>
      </div>
    </div>
  );
}

        {c.notes && <div style={{ background: "#F1E4C9", borderRadius: 10, padding: "8px 12px", fontSize: 12.5, color: "#5A1229", marginBottom: 14 }}>{c.notes}</div>}

        <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>

              const hasVals = vals && Object.values(vals).some(v => v);
              return (

                  background: "#FFFDF8", border: "1px solid #EADFC0", borderRadius: 12, padding: "12px 14px", marginBottom: 9, cursor: "pointer",
                  display: "flex", alignItems: "center", justifyContent: "space-between",
                }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 14, color: "#3B0F20" }}>{MEASURE_TEMPLATES[key].label}</div>
                    <div style={{ fontSize: 12, color: hasVals ? "#3a8a4a" : "#a99485" }}>{hasVals ? "Saved" : "Not recorded yet"}</div>
                  </div>
                  <Icon name="ChevronRight" size={16} color="#C79B3B" />

              );
            })}
            <div onClick={() => push("measurementForm", { customerId: c.id, template: "custom" })} style={{
              background: "#F1E4C9", border: "1px dashed #C79B3B", borderRadius: 12, padding: "12px 14px",
              display: "flex", alignItems: "center", justifyContent: "space-between", cursor: "pointer",
            }}>

          </div>

          <div>

        {tab === "designs" && (
          <div>
            {customerOrders.filter(o => o.designPhoto).length === 0 ? (
              <EmptyState icon={<Icon name="Sparkles" size={30} />} title="No design photos" sub="Design photos added to orders will appear here." />
            ) : customerOrders.filter(o => o.designPhoto).map(o => (

            ))}

function OrderRow({ o, onClick }) {
  return (
    <div onClick={onClick} style={{
      background: "#FFFDF8", border: "1px solid #EADFC0", borderRadius: 12, padding: "11px 13px", marginBottom: 9, cursor: "pointer",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <span style={{ fontWeight: 700, fontSize: 13.5, color: "#3B0F20" }}>{o.orderNumber} · {o.garmentType}</span>
        <StatusBadge status={o.status} />
      </div>
      <div style={{ fontSize: 12, color: "#8a7360" }}>Delivery: {fmtDate(o.deliveryDate)} · {money(o.stitchingCharge)}</div>
    </div>
  );
}

function MeasurementForm(ctx) {
  const { params, customers, upsertCustomer, pop, showToast } = ctx;
  const c = customers.find(x => x.id === params.customerId);
  const isCustom = params.template === "custom";
  const template = isCustom ? null : MEASURE_TEMPLATES[params.template];
  const [vals, setVals] = useState(() => (isCustom ? {} : (c?.measurements?.[params.template] || {})));
  const [customFields, setCustomFields] = useState(c?.customFields || []);
  const [newField, setNewField] = useState({ name: "", value: "" });

  if (!c) return null;

  function save() {
    if (isCustom) {
      upsertCustomer({ id: c.id, customFields });
    } else {
      upsertCustomer({ id: c.id, measurements: { ...(c.measurements || {}), [params.template]: vals } });
    }
    showToast("Measurements saved");
    pop();
  }

  return (
    <div>
      <ScreenHeader title={isCustom ? "Custom Fields" : template.label} onBack={pop} />
      <div style={{ padding: "0 16px 24px" }}>
        <div style={{ fontSize: 13, color: "#8a7360", marginBottom: 14 }}>All values in inches, for {c.name}.</div>
        {!isCustom && template.fields.map(f => (
          <Field key={f} label={f}>
            <TextInput inputMode="decimal" placeholder="e.g. 14.5" value={vals[f] || ""} onChange={e => setVals(v => ({ ...v, [f]: e.target.value }))} />
          </Field>
        ))}
        {isCustom && (
          <div>
            {customFields.map((f, i) => (
              <div key={i} style={{ display: "flex", gap: 8, marginBottom: 10, alignItems: "center" }}>
                <TextInput value={f.name} onChange={e => setCustomFields(arr => arr.map((x, xi) => xi === i ? { ...x, name: e.target.value } : x))} placeholder="Field name" style={{ flex: 1.2 }} />
                <TextInput value={f.value} onChange={e => setCustomFields(arr => arr.map((x, xi) => xi === i ? { ...x, value: e.target.value } : x))} placeholder="Value" style={{ flex: 1 }} />
                <button onClick={() => setCustomFields(arr => arr.filter((_, xi) => xi !== i))} style={{ background: "none", border: "none", color: "#b23b3b", cursor: "pointer" }}><Icon name="X" size={17} /></button>
              </div>
            ))}
            <GhostButton onClick={() => setCustomFields(arr => [...arr, { name: "", value: "" }])} style={{ marginBottom: 16 }}>+ Add Field</GhostButton>
          </div>
        )}
        <PrimaryButton onClick={save}>Save Measurements</PrimaryButton>
      </div>
    </div>
  );
}

/* ================= ORDERS ================= */

function OrdersList(ctx) {
  const { orders, customers, push } = ctx;
  const [filter, setFilter] = useState("ALL");
  const sorted = [...orders].sort((a, b) => b.createdAt - a.createdAt);
  const filtered = filter === "ALL" ? sorted : sorted.filter(o => o.status === filter);
  function custName(id) { return customers.find(c => c.id === id)?.name || "Unknown"; }

  return (
    <div>
      <ScreenHeader title="Orders" right={<span style={{ fontSize: 12, color: "#8a7360" }}>{orders.length}/{ctx.settings.isPremium ? "∞" : FREE_LIMIT}</span>} />
      <div style={{ padding: "0 16px" }}>
        <div style={{ display: "flex", gap: 6, overflowX: "auto", marginBottom: 12, paddingBottom: 2 }}>
          {["ALL", ...STATUS_FLOW].map(s => (
            <button key={s} onClick={() => setFilter(s)} style={{
              flexShrink: 0, padding: "6px 11px", borderRadius: 20, border: "none", cursor: "pointer", fontSize: 11.5, fontWeight: 700,
              background: filter === s ? "#7A1B3A" : "#F1E4C9", color: filter === s ? "#FBF6EC" : "#5A1229",
            }}>{s}</button>
          ))}
        </div>
        {filtered.length === 0 && <EmptyState icon={<Icon name="ClipboardList" size={34} />} title="No orders here" sub="Tap + below to create a new order." />}
        {filtered.map(o => (
          <div key={o.id} onClick={() => push("orderDetail", { id: o.id })} style={{
            background: "#FFFDF8", border: "1px solid #EADFC0", borderRadius: 12, padding: "12px 14px", marginBottom: 9, cursor: "pointer",
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
              <span style={{ fontWeight: 700, fontSize: 14, color: "#3B0F20" }}>{o.orderNumber}</span>
              <StatusBadge status={o.status} />
            </div>
            <div style={{ fontSize: 12.5, color: "#5A1229", marginBottom: 2 }}>{custName(o.customerId)} · {o.garmentType}</div>
            <div style={{ fontSize: 11.5, color: "#8a7360" }}>Delivery: {fmtDate(o.deliveryDate)} · {money(o.stitchingCharge)}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function OrderForm(ctx) {
  const { params, customers, orders, upsertOrder, pop, showToast, settings } = ctx;
  const existing = params?.id ? orders.find(o => o.id === params.id) : null;
  const [form, setForm] = useState(existing || {
    customerId: params?.customerId || "", garmentType: "Kurti", designPhoto: "",
    measurementType: "womenDress", fabricDetails: "", orderDate: todayStr(), trialDate: "", deliveryDate: "",
    stitchingCharge: settings.defaultPrices?.stitching || "", advance: "", instructions: "", status: "NEW",
  });
  function set(k, v) { setForm(f => ({ ...f, [k]: v })); }
  const selectedCustomer = customers.find(c => c.id === form.customerId);

  function submit() {
    if (!form.customerId) { showToast("Please select a customer"); return; }
    const id = upsertOrder(form);
    if (id) { showToast(existing ? "Order updated" : "Order created"); pop(); }
  }

  return (
    <div>
      <ScreenHeader title={existing ? "Edit Order" : "New Order"} onBack={pop} />
      <div style={{ padding: "0 16px 24px" }}>
        <Field label="Customer *">
          <select value={form.customerId} onChange={e => set("customerId", e.target.value)} style={{ ...inputStyle, appearance: "none" }}>
            <option value="">Select customer</option>
            {customers.map(c => <option key={c.id} value={c.id}>{c.name}{c.mobile ? " · " + c.mobile : ""}</option>)}
          </select>
        </Field>
        {customers.length === 0 && (
          <div style={{ marginTop: -8, marginBottom: 14, fontSize: 12, color: "#8a7360" }}>No customers yet — add one first.</div>
        )}
        <Field label="Garment Type">
          <Select value={form.garmentType} onChange={e => set("garmentType", e.target.value)} options={GARMENTS} />
        </Field>
        <Field label="Design / Reference Photo">
          <PhotoPicker value={form.designPhoto} onChange={v => set("designPhoto", v)} />
        </Field>
        <Field label="Measurement Template">
          <select value={form.measurementType} onChange={e => set("measurementType", e.target.value)} style={{ ...inputStyle, appearance: "none" }}>
            {Object.keys(MEASURE_TEMPLATES).map(k => <option key={k} value={k}>{MEASURE_TEMPLATES[k].label}</option>)}
          </select>
        </Field>
        <Field label="Fabric Details">
          <TextInput value={form.fabricDetails} onChange={e => set("fabricDetails", e.target.value)} placeholder="e.g. Cotton print, 44 inch width" />
        </Field>
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 1 }}><Field label="Order Date"><TextInput type="date" value={form.orderDate} onChange={e => set("orderDate", e.target.value)} /></Field></div>
          <div style={{ flex: 1 }}><Field label="Trial Date"><TextInput type="date" value={form.trialDate} onChange={e => set("trialDate", e.target.value)} /></Field></div>
        </div>
        <Field label="Delivery Date">
          <TextInput type="date" value={form.deliveryDate} onChange={e => set("deliveryDate", e.target.value)} />
        </Field>
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 1 }}><Field label="Stitching Charge (₹)"><TextInput inputMode="numeric" value={form.stitchingCharge} onChange={e => set("stitchingCharge", e.target.value)} /></Field></div>
          <div style={{ flex: 1 }}><Field label="Advance Paid (₹)"><TextInput inputMode="numeric" value={form.advance} onChange={e => set("advance", e.target.value)} /></Field></div>
        </div>
        <div style={{ fontSize: 12.5, color: "#5A1229", marginBottom: 14 }}>Balance: <b>{money((Number(form.stitchingCharge) || 0) - (Number(form.advance) || 0))}</b></div>
        <Field label="Special Instructions">
          <TextArea value={form.instructions} onChange={e => set("instructions", e.target.value)} placeholder="Fit preferences, alterations, urgency, etc." />
        </Field>
        <Field label="Order Status">
          <Select value={form.status} onChange={e => set("status", e.target.value)} options={STATUS_FLOW} />
        </Field>
        <PrimaryButton onClick={submit}>{existing ? "Save Changes" : "Create Order"}</PrimaryButton>
      </div>
    </div>

function OrderDetail(ctx) {
  const { params, orders, customers, upsertOrder, deleteOrder, pop, push, showToast } = ctx;
  const o = orders.find(x => x.id === params.id);
  if (!o) return <EmptyState icon={<Icon name="ClipboardList" size={30} />} title="Order not found" sub="It may have been removed." />;
  const c = customers.find(x => x.id === o.customerId);
  const balance = (Number(o.stitchingCharge) || 0) - (Number(o.advance) || 0);

  function setStatus(s) { upsertOrder({ id: o.id, status: s }); showToast("Status updated to " + s); }

  return (
    <div>
      <ScreenHeader title={o.orderNumber} onBack={pop} right={
        <button onClick={() => push("orderForm", { id: o.id })} style={iconBtnStyle}><Icon name="Pencil" size={16} color="#5A1229" /></button>
      } />
      <div style={{ padding: "0 16px 24px" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
          <div>
            <div style={{ fontFamily: "'Playfair Display',serif", fontSize: 17, fontWeight: 700, color: "#3B0F20" }}>{o.garmentType}</div>
            <div style={{ fontSize: 12.5, color: "#8a7360" }} onClick={() => c && push("customerDetail", { id: c.id })}>{c?.name || "Unknown customer"} · {c?.mobile}</div>
          </div>
          <StatusBadge status={o.status} />
        </div>

        {o.designPhoto && <img src={o.designPhoto} alt="" style={{ width: "100%", borderRadius: 12, marginBottom: 14 }} />}

        <div style={{ display: "flex", gap: 6, overflowX: "auto", marginBottom: 16, paddingBottom: 2 }}>
          {STATUS_FLOW.map(s => (
            <button key={s} onClick={() => setStatus(s)} style={{
              flexShrink: 0, padding: "7px 11px", borderRadius: 20, border: s === o.status ? "none" : "1px solid #EADFC0", cursor: "pointer", fontSize: 11,
              fontWeight: 700, background: s === o.status ? STATUS_COLORS[s] : "#FFFDF8", color: s === o.status ? "#fff" : "#5A1229",
            }}>{s}</button>
          ))}
        </div>

        <DetailRow label="Fabric" value={o.fabricDetails || "—"} />
        <DetailRow label="Measurement Template" value={MEASURE_TEMPLATES[o.measurementType]?.label || o.measurementType} />
        <DetailRow label="Order Date" value={fmtDate(o.orderDate)} />
        <DetailRow label="Trial Date" value={fmtDate(o.trialDate)} />
        <DetailRow label="Delivery Date" value={fmtDate(o.deliveryDate)} />
        <DetailRow label="Stitching Charge" value={money(o.stitchingCharge)} />
        <DetailRow label="Advance Paid" value={money(o.advance)} />
        <DetailRow label="Balance Due" value={money(balance)} highlight={balance > 0} />
        {o.instructions && <DetailRow label="Instructions" value={o.instructions} />}

        <StitchDivider />
        <GhostButton onClick={() => push("whatsapp", { orderId: o.id })} style={{ marginBottom: 10 }}>
          <span style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}><Icon name="MessageCircle" size={15} /> Send WhatsApp Update</span>
        </GhostButton>
        <button onClick={() => { if (confirm("Delete this order?")) { deleteOrder(o.id); showToast("Order deleted"); pop(); } }}
          style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: "#b23b3b", fontSize: 13, fontWeight: 600, cursor: "pointer", padding: "6px 0" }}>
          <Icon name="Trash2" size={14} /> Delete Order
        </button>
      </div>
    </div>
  );
}

function DetailRow({ label, value, highlight }) {

function MaterialCalculator({ ctx }) {
  const [garment, setGarment] = useState("Kurti");
  const [length, setLength] = useState("42");
  const [sleeve, setSleeve] = useState("18");
  const [width, setWidth] = useState("44");
  const [count, setCount] = useState("1");
  const [manual, setManual] = useState("");

  const estimate = useMemo(() => {
    const L = Number(length) || 0, S = Number(sleeve) || 0, W = Number(width) || 44, N = Number(count) || 1;
    // simple heuristic in meters, based on garment length + sleeve allowance, width factor
    let base = (L + S * 0.5 + 20) / 39.37; // inches to meters, plus seam/hem allowance
    if (W < 40) base *= 1.15;
    const factorByGarment = { Kurti: 1, Blouse: 0.6, "Salwar Suit": 2.2, Lehenga: 3.5, Gown: 3, "Saree Blouse": 0.6, Shirt: 1, Pant: 1.1, "Kids Dress": 0.7, Custom: 1 };
    const fabric = base * (factorByGarment[garment] ?? 1) * N;
    const lining = ["Lehenga", "Gown", "Salwar Suit"].includes(garment) ? fabric * 0.6 : fabric * 0.2;
    const fusing = ["Shirt", "Blouse", "Saree Blouse"].includes(garment) ? 0.3 * N : 0.15 * N;
    const buttons = garment === "Shirt" ? 8 * N : garment === "Blouse" ? 2 * N : 0;
    const zip = ["Lehenga", "Gown", "Salwar Suit", "Pant"].includes(garment) ? 1 * N : 0;
    const lace = ["Lehenga", "Gown"].includes(garment) ? fabric * 0.3 : 0;
    return { fabric: fabric.toFixed(2), lining: lining.toFixed(2), fusing: fusing.toFixed(2), buttons, zip, lace: lace.toFixed(2) };
  }, [garment, length, sleeve, width, count]);

  return (
    <div>
      <Field label="Garment Type"><Select value={garment} onChange={e => setGarment(e.target.value)} options={GARMENTS} /></Field>
      <div style={{ display: "flex", gap: 10 }}>
        <div style={{ flex: 1 }}><Field label="Garment Length (in)"><TextInput inputMode="decimal" value={length} onChange={e => setLength(e.target.value)} /></Field></div>
        <div style={{ flex: 1 }}><Field label="Sleeve Length (in)"><TextInput inputMode="decimal" value={sleeve} onChange={e => setSleeve(e.target.value)} /></Field></div>
      </div>
      <div style={{ display: "flex", gap: 10 }}>
        <div style={{ flex: 1 }}><Field label="Fabric Width (in)"><TextInput inputMode="decimal" value={width} onChange={e => setWidth(e.target.value)} /></Field></div>
        <div style={{ flex: 1 }}><Field label="No. of Garments"><TextInput inputMode="numeric" value={count} onChange={e => setCount(e.target.value)} /></Field></div>
      </div>

      <StitchDivider />
      <div style={{ fontSize: 11.5, color: "#8a7360", marginBottom: 10, fontStyle: "italic" }}>
        Estimates only — actual fabric use varies by cutting pattern, design and tailor preference.
      </div>
      <ResultRow label="Estimated Fabric Required" value={estimate.fabric + " m"} />
      <ResultRow label="Lining Required" value={estimate.lining + " m"} />
      <ResultRow label="Interlining / Fusing" value={estimate.fusing + " m"} />
      <ResultRow label="Buttons" value={estimate.buttons + " pcs"} />
      <ResultRow label="Zip" value={estimate.zip + " pcs"} />
      <ResultRow label="Lace" value={estimate.lace + " m"} />

      <Field label="Manual Adjustment / Notes">
        <TextArea value={manual} onChange={e => setManual(e.target.value)} placeholder="Override the estimate here if needed, e.g. + 0.5m for pattern matching" />
      </Field>
    </div>
  );
}

function ResultRow({ label, value }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "9px 12px", background: "#FFFDF8", border: "1px solid #EADFC0", borderRadius: 10, marginBottom: 7 }}>
      <span style={{ fontSize: 13, color: "#5A1229" }}>{label}</span>

}

function PriceCalculator({ ctx }) {
  const dp = ctx.settings.defaultPrices || {};
  const [fabric, setFabric] = useState("");
  const [lining, setLining] = useState(String(dp.lining || ""));
  const [accessories, setAccessories] = useState(String(dp.accessories || ""));
  const [stitching, setStitching] = useState(String(dp.stitching || ""));
  const [embroidery, setEmbroidery] = useState(String(dp.embroidery || ""));
  const [other, setOther] = useState("");
  const [sellingOverride, setSellingOverride] = useState("");

  const materialCost = (Number(fabric) || 0) + (Number(lining) || 0) + (Number(accessories) || 0) + (Number(other) || 0);
  const totalCost = materialCost + (Number(stitching) || 0) + (Number(embroidery) || 0);
  const selling = sellingOverride !== "" ? Number(sellingOverride) : totalCost;
  const profit = selling - materialCost;

  return (
    <div>
      <FieldMoney label="Fabric Cost" value={fabric} onChange={setFabric} />
      <FieldMoney label="Lining Cost" value={lining} onChange={setLining} />
      <FieldMoney label="Accessories / Material Cost" value={accessories} onChange={setAccessories} />
      <FieldMoney label="Stitching Charge" value={stitching} onChange={setStitching} />
      <FieldMoney label="Embroidery / Extra Work" value={embroidery} onChange={setEmbroidery} />
      <FieldMoney label="Other Expenses" value={other} onChange={setOther} />
      <FieldMoney label="Selling Price (auto, editable)" value={sellingOverride} onChange={setSellingOverride} placeholder={String(totalCost)} />

      <StitchDivider />
      <ResultRow label="Total Cost" value={money(totalCost)} />
      <ResultRow label="Selling Price" value={money(selling)} />
      <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 12px", background: "#F1E4C9", borderRadius: 10, marginTop: 6 }}>
        <span style={{ fontSize: 13.5, fontWeight: 700, color: "#5A1229" }}>Estimated Profit</span>
        <span style={{ fontSize: 15, fontWeight: 800, color: profit >= 0 ? "#3a8a4a" : "#b23b3b" }}>{money(profit)}</span>
      </div>
    </div>
  );
}
function FieldMoney({ label, value, onChange, placeholder }) {
  return <Field label={label}><TextInput inputMode="decimal" value={value} placeholder={placeholder || "0"} onChange={e => onChange(e.target.value)} /></Field>;
}

/* ================= WHATSAPP ================= */

function WhatsAppScreen(ctx) {
  const { customers, orders, params, pop } = ctx;
  const preOrder = params?.orderId ? orders.find(o => o.id === params.orderId) : null;
  const [customerId, setCustomerId] = useState(preOrder?.customerId || "");
  const [orderId, setOrderId] = useState(preOrder?.id || "");

  const customerOrders = orders.filter(o => o.customerId === customerId);
  const order = orders.find(o => o.id === orderId);
  const customer = customers.find(c => c.id === customerId);
  const balance = order ? (Number(order.stitchingCharge) || 0) - (Number(order.advance) || 0) : 0;

  const message = order && customer
    ? `Hello ${customer.name},\nYour ${order.garmentType} order is ready.\nDelivery Date: ${fmtDate(order.deliveryDate)}\nTotal: ${money(order.stitchingCharge)}\nAdvance: ${money(order.advance)}\nBalance: ${money(balance)}\nThank you for choosing us.`
    : "";

  function send() {
    const num = (customer?.mobile || "").replace(/\D/g, "");
    const text = encodeURIComponent(message);
    window.open(`https://wa.me/${num ? "91" + num.slice(-10) : ""}?text=${text}`, "_blank");
  }
  function copy() {
    navigator.clipboard?.writeText(message);
    ctx.showToast("Message copied");
  }

  return (
    <div>
      <ScreenHeader title="WhatsApp Update" onBack={pop} />
      <div style={{ padding: "0 16px 24px" }}>
        <Field label="Customer">
          <select value={customerId} onChange={e => { setCustomerId(e.target.value); setOrderId(""); }} style={{ ...inputStyle, appearance: "none" }}>
            <option value="">Select customer</option>
            {customers.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </Field>
        {customerId && (
          <Field label="Order">
            <select value={orderId} onChange={e => setOrderId(e.target.value)} style={{ ...inputStyle, appearance: "none" }}>
              <option value="">Select order</option>
              {customerOrders.map(o => <option key={o.id} value={o.id}>{o.orderNumber} · {o.garmentType}</option>)}
            </select>
          </Field>
        )}

        {order && customer ? (
          <div>
            <div style={{ background: "#FFFDF8", border: "1px solid #EADFC0", borderRadius: 12, padding: "14px", whiteSpace: "pre-wrap", fontSize: 13.5, color: "#3B0F20", lineHeight: 1.6, marginBottom: 14 }}>
              {message}
            </div>
            <PrimaryButton onClick={send} style={{ marginBottom: 10 }}>
              <span style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}><Icon name="MessageCircle" size={16} /> Open in WhatsApp</span>
            </PrimaryButton>
            <GhostButton onClick={copy}>Copy Message</GhostButton>
          </div>
        ) : (
          <EmptyState icon={<Icon name="MessageCircle" size={30} />} title="Pick a customer and order" sub="A ready-to-send WhatsApp message will appear here." />
        )}
      </div>
    </div>
  );
}

/* ================= SUMMARY ================= */

function SummaryScreen(ctx) {
  const { orders, customers, stats, pop } = ctx;

  const last6 = useMemo(() => {
    const arr = [];
    const now = new Date();
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const rev = orders.filter(o => {
        if (!o.deliveryDate || o.status !== "DELIVERED") return false;
        const od = new Date(o.deliveryDate);
        return od.getMonth() === d.getMonth() && od.getFullYear() === d.getFullYear();
      }).reduce((s, o) => s + (Number(o.stitchingCharge) || 0), 0);
      arr.push({ label: d.toLocaleDateString("en-IN", { month: "short" }), rev });
    }
    return arr;
  }, [orders]);
  const max = Math.max(1, ...last6.map(m => m.rev));

  return (
    <div>
      <ScreenHeader title="Business Summary" onBack={pop} />
      <div style={{ padding: "0 16px 24px" }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
          <StatCard label="Today's Orders" value={stats.todaysOrders.length} />
          <StatCard label="Pending Orders" value={stats.pending.length} />
          <StatCard label="Completed Orders" value={stats.completed.length} />
          <StatCard label="Today's Revenue" value={money(stats.todaysRevenue)} />
          <StatCard label="Monthly Revenue" value={money(stats.monthRevenue)} />
          <StatCard label="Pending Payments" value={money(stats.pendingPayments)} />
        </div>
        <StatCard label="Number of Customers" value={customers.length} />

        <StitchDivider />
        <div style={{ fontFamily: "'Playfair Display',serif", fontSize: 15, color: "#3B0F20", marginBottom: 10 }}>Revenue — last 6 months</div>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 8, height: 120, marginBottom: 6 }}>
          {last6.map((m, i) => (
            <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
              <div style={{ width: "100%", height: Math.max(4, (m.rev / max) * 90), background: "linear-gradient(180deg,#C79B3B,#7A1B3A)", borderRadius: 6 }} />
              <span style={{ fontSize: 10.5, color: "#8a7360" }}>{m.label}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

            <div style={{ fontSize: 11.5, fontWeight: 700, color: "#8a7360", marginBottom: 6 }}>CUSTOMERS</div>
            {custMatches.map(c => (
              <div key={c.id} onClick={() => push("customerDetail", { id: c.id })} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 6px", cursor: "pointer", borderBottom: "1px dashed #E4D3AE" }}>
                <Avatar photo={c.photo} name={c.name} size={34} />
                <div><div style={{ fontSize: 13.5, fontWeight: 700, color: "#3B0F20" }}>{c.name}</div><div style={{ fontSize: 11.5, color: "#8a7360" }}>{c.mobile}</div></div>
              </div>
            ))}
          </div>
        )}
        {orderMatches.length > 0 && (
          <div>
            <div style={{ fontSize: 11.5, fontWeight: 700, color: "#8a7360", marginBottom: 6 }}>ORDERS</div>
            {orderMatches.map(o => <OrderRow key={o.id} o={o} onClick={() => push("orderDetail", { id: o.id })} />)}
          </div>
        )}
      </div>
    </div>
  );
}

/* ================= UPGRADE MODAL ================= */

function UpgradeModal({ onClose, settings, persistSettings, showToast }) {
  const [plan, setPlan] = useState("monthly49");
  function activate() {
    persistSettings({ ...settings, isPremium: true });
    showToast("Premium activated (placeholder)");
    onClose();
  }
  return (
    <div onClick={onClose} style={{ position: "absolute", inset: 0, background: "rgba(42,30,34,0.5)", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: "#FBF6EC", borderRadius: 18, padding: 22, width: "100%", maxWidth: 360, position: "relative" }}>
        <button onClick={onClose} style={{ position: "absolute", top: 12, right: 12, background: "none", border: "none", cursor: "pointer" }}><Icon name="X" size={18} color="#8a7360" /></button>
        <div style={{ textAlign: "center", marginBottom: 16 }}>
          <Icon name="Crown" size={30} color="#C79B3B" />
          <div style={{ fontFamily: "'Playfair Display',serif", fontSize: 19, fontWeight: 700, color: "#3B0F20", marginTop: 6 }}>Go Premium</div>
          <div style={{ fontSize: 12.5, color: "#8a7360", marginTop: 3 }}>Unlimited customers &amp; orders, AI design suggestions, advanced calculators, reports, WhatsApp templates and backup.</div>
        </div>
        {[["monthly49", "₹49 / month"], ["monthly99", "₹99 / month · Pro features"]].map(([k, l]) => (
          <button key={k} onClick={() => setPlan(k)} style={{
            width: "100%", textAlign: "left", padding: "12px 14px", borderRadius: 12, marginBottom: 9, cursor: "pointer",
            border: plan === k ? "2px solid #7A1B3A" : "1.5px solid #EADFC0", background: plan === k ? "#F1E4C9" : "#FFFDF8",
            fontSize: 14, fontWeight: 700, color: "#3B0F20",
          }}>{l}</button>
        ))}
        <div style={{ fontSize: 11, color: "#a99485", marginBottom: 14, fontStyle: "italic" }}>Payments aren't processed yet — this activates a placeholder premium state during testing.</div>
        <PrimaryButton onClick={activate}>Activate Premium</PrimaryButton>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
